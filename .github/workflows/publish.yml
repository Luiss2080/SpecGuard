name: Test y publicar
on:
  push: { branches: [main] }
  pull_request:
  release: { types: [published] }
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [18, 20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test
  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://npm.pkg.github.com", scope: "@luiss2080" }
      - run: npm publish
        env: { NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
